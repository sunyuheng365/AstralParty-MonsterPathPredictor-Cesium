name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Run unit tests
        run: dotnet test tests/MonsterPathPredictor.Tests/MonsterPathPredictor.Tests.csproj -c Release --verbosity normal
      - name: Build and self-test ReplayCertifier
        run: |
          dotnet build tools/ReplayCertifier/ReplayCertifier.csproj -c Release --nologo
          dotnet run --project tools/ReplayCertifier/ReplayCertifier.csproj -c Release --no-build -- --self-test
